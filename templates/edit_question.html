{% extends 'base.html' %}
{% block content %}
<div style="max-width: 500px; margin: auto; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
    <h2>Edit Quiz Question</h2>
    <form method="POST">
        <label>Question Text:</label>
        <input type="text" name="question" value="{{ q.question }}" style="width:100%; padding:10px; margin: 5px 0 15px 0;" required><br>
        
        <label>Option A:</label>
        <input type="text" name="option_a" value="{{ q.option_a }}" style="width:100%; padding:10px; margin: 5px 0 15px 0;" required><br>
        
        <label>Option B:</label>
        <input type="text" name="option_b" value="{{ q.option_b }}" style="width:100%; padding:10px; margin: 5px 0 15px 0;" required><br>
        
        <label>Option C:</label>
        <input type="text" name="option_c" value="{{ q.option_c }}" style="width:100%; padding:10px; margin: 5px 0 15px 0;" required><br>
        
        <label>Option D:</label>
        <input type="text" name="option_d" value="{{ q.option_d }}" style="width:100%; padding:10px; margin: 5px 0 15px 0;" required><br>
        
        <label for="correct_answer">Correct Option:</label>
        <select name="correct_answer" style="width:100%; padding:10px; margin: 5px 0 15px 0;">
            <option value="A" {% if q.correct_answer == 'A' %}selected{% endif %}>A</option>
            <option value="B" {% if q.correct_answer == 'B' %}selected{% endif %}>B</option>
            <option value="C" {% if q.correct_answer == 'C' %}selected{% endif %}>C</option>
            <option value="D" {% if q.correct_answer == 'D' %}selected{% endif %}>D</option>
        </select><br>
        
        <button type="submit" style="background: #2ecc71; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;">Update Question</button>
        <a href="{{ url_for('admin_dashboard', tab='ManageQuiz') }}" style="margin-left: 15px; color: #7f8c8d; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
