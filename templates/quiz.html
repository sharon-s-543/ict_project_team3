{% extends 'base.html' %}
{% block content %}
    <h2>Amanikipaasi Language Quiz</h2>
    
    <div id="quizContainer">
        <form id="quizForm">
            {% for q in questions %}
            <div class="quiz-block" data-id="{{ q.id }}" data-correct="{{ q.correct_answer }}">
                <p class="quiz-question"><strong>Q{{ loop.index }}: {{ q.question }}</strong></p>
                
                <label><input type="radio" name="q{{ q.id }}" value="A" data-text="{{ q.option_a }}"> A) {{ q.option_a }}</label><br>
                <label><input type="radio" name="q{{ q.id }}" value="B" data-text="{{ q.option_b }}"> B) {{ q.option_b }}</label><br>
                <label><input type="radio" name="q{{ q.id }}" value="C" data-text="{{ q.option_c }}"> C) {{ q.option_c }}</label><br>
                <label><input type="radio" name="q{{ q.id }}" value="D" data-text="{{ q.option_d }}"> D) {{ q.option_d }}</label><br>
            </div>
            <hr>
            {% endfor %}
            <button type="button" class="submit-quiz-btn" onclick="checkAnswers()">Submit Quiz</button>
        </form>
    </div>

    <div id="resultsContainer" style="display: none;">
        <div class="score-banner">
            <h3>Quiz Completed!</h3>
            <h2 id="quizResultText"></h2>
        </div>
        
        <div id="reviewList"></div>
        
        <div style="margin-top: 30px; text-align: center;">
            <button type="button" class="retry-quiz-btn" onclick="window.location.reload();">Try a New Quiz</button>
        </div>
    </div>

<script src="{{url_for('static',filename='script/quiz.js')}}"></script>
{% endblock %}
